name: Build FLEX Dylib for TrollFools

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install ldid-procursus
        run: |
          brew install ldid-procursus
          echo "✅ ldid-procursus installed: $(ldid --version 2>&1 || true)"

      - name: Build Optimized FLEX Dylib
        run: |
          xcodebuild -project FLEX.xcodeproj \
            -scheme FLEX \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MACH_O_TYPE=mh_dylib \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            SKIP_INSTALL=NO \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            -derivedDataPath ./build \
            clean build

      - name: Extract, Sign and Package Dylib
        run: |
          mkdir -p output
          
          # 查找编译出的纯 arm64 dylib 二进制（排除 dSYM 和 framework 目录）
          DYLIB_PATH=$(find ./build -type f -name "FLEX" ! -name "*.dSYM" ! -path "*/FLEX.framework/*" ! -path "*/usr/lib/*" | head -n 1)
          
          if [ -z "$DYLIB_PATH" ]; then
            echo "❌ Error: Could not find standalone FLEX dylib binary."
            echo "📂 Listing all files in build directory for debugging:"
            find ./build -type f | grep -i flex || true
            exit 1
          fi
          
          echo "✅ Found raw binary at: $DYLIB_PATH"
          RAW_SIZE=$(stat -f%z "$DYLIB_PATH")
          echo "📏 Raw size: $((RAW_SIZE / 1024)) KB"
          
          # 复制到输出目录并重命名
          cp "$DYLIB_PATH" output/FLEX.dylib
          
          # 使用新版 ldid-procursus 进行 ad-hoc 预签名
          echo "🔏 Signing with ldid-procursus..."
          ldid -S output/FLEX.dylib
          
          # 验证签名
          ldid -e output/FLEX.dylib > /dev/null 2>&1 && echo "✅ Signature verified" || echo "⚠️ Signature verification failed"
          
          # 输出最终文件大小
          FINAL_SIZE=$(stat -f%z output/FLEX.dylib)
          echo "📦 Final signed dylib size: $((FINAL_SIZE / 1024)) KB ($((FINAL_SIZE / 1024 / 1024)).$((FINAL_SIZE * 100 / 1024 / 1024 % 100)) MB)"
          
          # 如果仍然超过 3MB 发出警告
          if [ "$FINAL_SIZE" -gt 3145728 ]; then
            echo "⚠️ WARNING: Dylib is still larger than 3MB! TrollFools may still fail."
          else
            echo "✅ Size is under 3MB threshold. Safe for TrollFools injection."
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLEX-TrollFools-arm64
          path: output/FLEX.dylib
          retention-days: 30
