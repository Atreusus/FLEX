name: Build FLEX Dylib for TrollFools

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install ldid-procursus
        run: |
          brew install ldid-procursus
          echo "✅ ldid-procursus installed"

      - name: Build FLEX Framework
        run: |
          # 既然无法强制转为纯 dylib，就直接编译标准的 Framework
          xcodebuild -project FLEX.xcodeproj \
            -scheme FLEX \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            SKIP_INSTALL=NO \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            -derivedDataPath ./build \
            clean build

      - name: Extract, Convert and Sign Dylib
        run: |
          mkdir -p output
          
          # 直接从 .framework 中提取 Mach-O 二进制
          FRAMEWORK_BINARY="./build/Build/Products/Release-iphoneos/FLEX.framework/FLEX"
          
          if [ ! -f "$FRAMEWORK_BINARY" ]; then
            echo "❌ Error: Framework binary not found at $FRAMEWORK_BINARY"
            exit 1
          fi
          
          echo "✅ Found framework binary"
          cp "$FRAMEWORK_BINARY" output/FLEX.dylib
          
          # 验证是否为有效的 Mach-O 文件
          file output/FLEX.dylib
          
          # 使用新版 ldid-procursus 进行 ad-hoc 预签名
          echo "🔏 Signing with ldid-procursus..."
          ldid -S output/FLEX.dylib
          
          # 验证签名
          ldid -e output/FLEX.dylib > /dev/null 2>&1 && echo "✅ Signature verified" || echo "⚠️ Signature verification failed"
          
          # 输出最终文件大小
          FINAL_SIZE=$(stat -f%z output/FLEX.dylib)
          echo "📦 Final signed dylib size: $((FINAL_SIZE / 1024)) KB"
          
          if [ "$FINAL_SIZE" -gt 3145728 ]; then
            echo "⚠️ WARNING: Dylib is still larger than 3MB! TrollFools may still fail."
          else
            echo "✅ Size is under 3MB threshold. Safe for TrollFools injection."
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLEX-TrollFools-arm64
          path: output/FLEX.dylib
          retention-days: 30
